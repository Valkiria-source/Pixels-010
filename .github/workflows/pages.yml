name: Compila APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        run: npm install

      - name: Prepara il progetto Android
        run: |
          npm run build
          npx cap add android
          npx cap sync android

      - name: Blocca lo schermo in verticale
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Tema chiaro fisso (niente oscuramento automatico)
        run: |
          sed -i 's/Theme.AppCompat.DayNight.NoActionBar/Theme.AppCompat.Light.NoActionBar/g' android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#    <item name="android:forceDarkAllowed">false</item>\n    </style>#g' android/app/src/main/res/values/styles.xml
          cat android/app/src/main/res/values/styles.xml

      - name: Genera icone e splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#fbfbfd' --splashBackgroundColor '#fbfbfd'

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: PIXELS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
